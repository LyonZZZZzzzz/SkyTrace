<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SkyTrace App Icon</title>
  <desc id="desc">A cyan celestial trace sweeping toward a warm four-point target star.</desc>
  <defs>
    <radialGradient id="sky" cx="72%" cy="27%" r="91%">
      <stop offset="0" stop-color="#0E1A33"/>
      <stop offset="0.44" stop-color="#07152A"/>
      <stop offset="1" stop-color="#02060E"/>
    </radialGradient>
    <radialGradient id="vignette" cx="48%" cy="46%" r="76%">
      <stop offset="0" stop-color="#02060E" stop-opacity="0"/>
      <stop offset="0.66" stop-color="#02060E" stop-opacity="0"/>
      <stop offset="1" stop-color="#02060E" stop-opacity="0.58"/>
    </radialGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="260" y1="785" x2="738" y2="305">
      <stop offset="0" stop-color="#40D1FA" stop-opacity="0.18"/>
      <stop offset="0.3" stop-color="#2AB9E8" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#40D1FA" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#C9F8FF"/>
    </linearGradient>
    <linearGradient id="trail-highlight" gradientUnits="userSpaceOnUse" x1="315" y1="748" x2="735" y2="305">
      <stop offset="0" stop-color="#83E7FF" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#83E7FF" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#E8FDFF" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="trail-blur" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>

  <g opacity="0.94">
    <path d="M 313 799 C 447 673 582 529 738 309 L 715 289 C 580 488 433 636 247 725 Z"
          fill="#40D1FA" opacity="0.5" filter="url(#trail-blur)"/>
    <path d="M 313 799 C 447 673 582 529 738 309 L 715 289 C 580 488 433 636 247 725 Z"
          fill="url(#trail)"/>
    <path d="M 294 756 C 431 630 568 500 722 307"
          fill="none" stroke="url(#trail-highlight)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g>
    <circle cx="274" cy="760" r="48" fill="#40D1FA" opacity="0.1"/>
    <circle cx="274" cy="760" r="21" fill="#02060E" stroke="#40D1FA" stroke-width="10"/>
    <circle cx="274" cy="760" r="5" fill="#D9FAFF"/>
  </g>

  <g>
    <path d="M 730 208 C 738 271 774 308 844 319 C 775 330 739 367 730 434 C 721 367 685 330 616 319 C 685 308 721 271 730 208 Z"
          fill="#40D1FA"/>
  </g>

  <g fill="#E9FCFF">
    <path d="M 410 259 C 413 275 424 286 440 289 C 424 292 413 303 410 319 C 407 303 396 292 380 289 C 396 286 407 275 410 259 Z" opacity="0.45"/>
    <circle cx="548" cy="718" r="6" opacity="0.28"/>
    <circle cx="843" cy="543" r="4" opacity="0.24"/>
  </g>
</svg>
